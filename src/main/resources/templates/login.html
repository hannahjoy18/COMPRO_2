<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="login-container">
    <h1>Login</h1>
    <form action="/login" method="POST" th:object="${user}">

        <p class="form-error" th:if="${error}" th:text="${error}"></p>

        <div>
            <label for="username">User Name</label>
            <input type="text" th:field="*{username}" id="username" />
            <p class="form-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
        </div>

        <div>
            <label for="password">Password</label>
            <input type="password" th:field="*{password}" id="password" />
            <p class="form-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>

        <button type="submit">Login</button>
    </form>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
