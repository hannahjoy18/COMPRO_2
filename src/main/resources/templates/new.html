<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Add New Coffee</title>
    <style>
        :root {
            --background-color: #FAEBD7;
            --text-color: #6B3F2A;
            --form-bg: #FFF8E1;
            --input-bg: #F3E5AB;
            --border-color: #8B4513;
            --button-bg: #A0522D;
            --button-hover: #8B4513;
            --link-color: #6B3F2A;
            --link-hover: #8B4513;
            --border-radius: 12px;
            --padding: 12px;
            --margin: 20px;
            --font-family: 'Courier New', Courier, monospace;
        }

        body {
            font-family: var(--font-family);
            margin: var(--margin);
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        h1 {
            color: var(--text-color);
            text-align: center;
            margin-bottom: var(--margin);
            font-size: 2.5em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        form {
            max-width: 500px;
            margin: auto;
            background-color: var(--form-bg);
            padding: 50px;
            border-radius: var(--border-radius);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border: 2px solid var(--border-color);
        }

        label {
            display: block;
            margin: var(--padding) 0;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: var(--padding);
            margin-top: 5px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: var(--border-radius);
            font-size: 1em;
        }

        button {
            margin-top: var(--margin);
            padding: var(--padding) 20px;
            background-color: var(--button-bg);
            color: #FFF;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s ease;
            font-size: 1.1em;
            text-transform: uppercase;
        }

        button:hover {
            background-color: var(--button-hover);
        }

        a {
            text-decoration: none;
            color: var(--link-color);
            font-weight: bold;
            display: block;
            text-align: center;
            margin-top: var(--margin);
            font-size: 1.2em;
        }

        a:hover {
            color: var(--link-hover);
        }

        fieldset {
            margin-top: var(--margin);
            border: 1px solid var(--border-color);
            padding: var(--padding);
            border-radius: var(--border-radius);
        }

        legend {
            font-weight: bold;
            color: var(--text-color);
        }

        fieldset label {
            display: inline-block;
            margin-right: 10px;
        }
    </style>
</head>
<body>

<h1>Add New Coffee</h1>

<form th:action="@{/save}" method="POST" th:object="${newCoffee}">

    <label>Name:</label>
    <input type="text" th:field="*{name}" required><br>

    <label>Type:</label>
    <input type="text" th:field="*{type}" required><br>

    <label>Size:</label>
    <input type="text" th:field="*{size}" required><br>

    <label>Price:</label>
    <input type="number" step="0.01" th:field="*{price}" required><br>

    <label>Roast Level:</label>
    <input type="text" th:field="*{roastLevel}" required><br>

    <label>Origin:</label>
    <input type="text" th:field="*{origin}" required><br>

    <label>Is Decaf:</label>
    <input type="checkbox" th:field="*{decaf}"><br>

    <label>Stock:</label>
    <input type="number" th:field="*{stock}" required><br>

    <label>Flavor Notes:</label><br>
    <div th:each="flavor : ${allFlavorOptions}">
        <input type="checkbox" name="flavorNotes"
               th:value="${flavor}"
               th:id="${flavor}">
        <label th:for="${flavor}" th:text="${flavor}"></label><br>
    </div>

    <label>Brew Method:</label>
    <input type="text" th:field="*{brewMethod}" required><br>

    <button type="submit">Add Coffee</button>
</form>
    <a href="/">Back to List</a>
</body>
</html>
