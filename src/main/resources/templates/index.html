<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hannah's Bloom Cafe - Coffee List</title>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
    <div class="top">
        <div class="logo-section">
            <img th:src="@{/images/coffee_logo.jpg}" alt="Cafe Logo"/>
            <span>Hannah Bloom's Cafe</span>
        </div>

        <div class="menu">
            <ul>
                <li><a th:href="@{/}">Home &gt;</a></li>
                <li><a th:href="@{/add}">Add Coffee &gt;</a></li>
                <li><a th:href="@{/catalog}">Catalog &gt;</a></li>
                <li><a th:href="@{/login}">Logout &gt;</a></li>
            </ul>
        </div>
    </div>

    <div class="user-profile">
        <img th:src="@{/images/profile.jpg}" alt="Owner Profile"/>
        <div>
            <h1>Hannah Bag-oyen</h1>
            <span>Owner</span>
        </div>
    </div>
</aside>

<!-- Main Content -->
<main>
    <header>
        <h1>Hannah's Bloom Cafe</h1>
        <p>Coffee List</p>
    </header>

    <form method="get" class="search-form">
        <label>
            <input type="text" name="search" placeholder="Search..."/>
        </label>
        <button type="submit">Search</button>
        <a th:href="@{/add}" class="add-button">Add New Coffee</a>
    </form>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Type</th>
            <th>Size</th>
            <th>Price</th>
            <th>Roast Level</th>
            <th>Origin</th>
            <th>Decaf</th>
            <th>Stock</th>
            <th>Flavor Notes</th>
            <th>Brew Method</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="coffee : ${coffees}">
            <td th:text="${coffee.id}"></td>
            <td th:text="${coffee.name}"></td>
            <td th:text="${coffee.type}"></td>
            <td th:text="${coffee.size}"></td>
            <td th:text="${coffee.price}"></td>
            <td th:text="${coffee.roastLevel}"></td>
            <td th:text="${coffee.origin}"></td>
            <td th:text="${coffee.decaf} ? 'Yes' : 'No'"></td>
            <td th:text="${coffee.stock}"></td>
            <td th:text="${#strings.arrayJoin(coffee.flavorNotes, ', ')}"></td>
            <td th:text="${coffee.brewMethod}"></td>
            <td class="actions">
                <a th:href="@{'/edit'(id=${coffee.id})}">Edit</a>
                <a th:href="@{'/delete'(id=${coffee.id})}">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>

</body>
</html>
